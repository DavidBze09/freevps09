plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.example.phonetradingagent'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.phonetradingagent.fresh'
        minSdk 23
        targetSdk 32
        versionCode 2
        versionName '0.2.0'
    }

    // Keep Java and Kotlin bytecode targets aligned. Without this, Gradle's
    // default Java 8 target conflicts with Kotlin's Java 17 target.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
